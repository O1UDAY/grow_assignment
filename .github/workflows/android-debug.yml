name: Build DueBack APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - run: bash gradlew --no-daemon --max-workers=2 --continue testDebugUnitTest lintDebug assembleDebug
      - name: Save lint and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DueBack-verification-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/**/lint-results-debug.txt
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - name: Verify signature and name APK
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk "deliverables/DueBack-capture-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs deliverables/DueBack-capture-debug.apk > deliverables/signing-certificate.txt
          cat deliverables/signing-certificate.txt
      - name: Save verified debug package
        uses: actions/upload-artifact@v4
        with:
          name: DueBack-debug
          path: deliverables/
          if-no-files-found: error
